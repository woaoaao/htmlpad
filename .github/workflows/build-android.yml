name: Build AiDou Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 编译 APK
        run: bash android/build.sh

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiDou-apk
          path: AiDou.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 把结果写回仓库
        if: always()
        run: |
          git config user.name builder
          git config user.email builder@example.com
          git add -f build-android.log || true
          if [ -f AiDou.apk ]; then git add -f AiDou.apk; fi
          git commit -m "android build $(date -u +%FT%TZ)" || true
          git push || true
