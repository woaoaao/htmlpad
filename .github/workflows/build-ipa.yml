name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看可用的 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true

      - name: 安装 XcodeGen
        run: |
          brew update > /dev/null 2>&1 || true
          brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 列出工程 / scheme（出错时方便排查）
        run: xcodebuild -list -project HTMLPad.xcodeproj

      - name: 编译（完全跳过代码签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project HTMLPad.xcodeproj \
            -scheme HTMLPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/HTMLPad.app"
          ls -la "$APP"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "$GITHUB_WORKSPACE/HTMLPad-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh HTMLPad-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HTMLPad-unsigned-ipa
          path: HTMLPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
